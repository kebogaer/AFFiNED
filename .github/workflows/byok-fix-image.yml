name: Build patched 0.27.4 image (BYOK fix)

# Builds the patched server native module and layers it on top of the
# official ghcr.io/toeverything/affine:0.27.4 image. The result is pushed to
# ghcr.io/<this repository owner>/affine:0.27.4-byokfix and the GitHub
# release v0.27.4-byokfix.1 gets the native modules attached.

on:
  push:
    branches:
      - byok-probe-fix-0.27.4
    tags:
      - 'v0.27.4-byokfix*'
  workflow_dispatch:

env:
  RELEASE_TAG: v0.27.4-byokfix.1

permissions:
  contents: write
  packages: write

jobs:
  build-server-native:
    name: Build server native - ${{ matrix.targets.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: true
      matrix:
        targets:
          - name: x86_64-unknown-linux-gnu
            file: server-native.x64.node
          - name: aarch64-unknown-linux-gnu
            file: server-native.arm64.node
          - name: armv7-unknown-linux-gnueabihf
            file: server-native.armv7.node
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          electron-install: false
          extra-flags: workspaces focus @affine/server-native
      - name: Build Rust
        uses: ./.github/actions/build-rust
        with:
          target: ${{ matrix.targets.name }}
          package: '@affine/server-native'
      - name: Rename ${{ matrix.targets.file }}
        run: mv ./packages/backend/native/server-native.node ./packages/backend/native/${{ matrix.targets.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-native-${{ matrix.targets.file }}
          path: ./packages/backend/native/${{ matrix.targets.file }}
          if-no-files-found: error

  build-image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: build-server-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: server-native-*
          merge-multiple: true
          path: ./.github/deployment/byok-fix/native
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/affine" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./.github/deployment/byok-fix
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ steps.image.outputs.name }}:0.27.4-byokfix
            ${{ steps.image.outputs.name }}:0.27.4-byokfix-${{ github.sha }}
      - name: Publish the release with the native modules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "AFFiNE 0.27.4 + BYOK key test fix" \
            --notes "Official AFFiNE 0.27.4 with the BYOK key test fixed for reasoning models (Gemini 3.x and similar). Docker image: \`${{ steps.image.outputs.name }}:0.27.4-byokfix\`" \
            ./.github/deployment/byok-fix/native/*.node \
            || gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./.github/deployment/byok-fix/native/*.node
